<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="payment-container">
        <h1>Payment Methods</h1>
        <form id="payment-form">
            <div class="form-group">
                <label for="amount">Amount (MMK)</label>
                <input type="number" id="amount" name="amount" placeholder="Enter amount" required>
            </div>

            <div class="form-group">
                <label>Select Payment Method</label>
                <div class="payment-methods">
                    <label class="payment-option">
                        <input type="radio" name="payment-method" value="KBZ Pay" required>
                        <img src="og-kbzpay.webp" alt="KBZ Pay">
                        <span>KBZ Pay</span>
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="payment-method" value="Wave Pay" required>
                        <img src="WaveMoney.png" alt="Wave Pay">
                        <span>Wave Pay</span>
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="payment-method" value="AYA Pay" required>
                        <img src="ayapay.png" alt="AYA Pay">
                        <span>AYA Pay</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <button type="submit" onclick="showAlert()">Pay Now</button>
            </div>
        </form>
    </div>

    <script>
        function showAlert(){
            alert("You are successfully purchased!Thank you.")
        }
    </script>
</body>
</html>
